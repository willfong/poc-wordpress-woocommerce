name: CI

on:
  push:
  pull_request:

jobs:
  plugin-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/woo-dev-template
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer stan
      - run: composer test

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: make dev-up
      - run: make smoke
      - run: make dev-down
        if: always()
