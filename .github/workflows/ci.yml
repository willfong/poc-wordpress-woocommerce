name: CI

on:
  push:
  pull_request:

jobs:
  plugin-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    defaults:
      run:
        working-directory: plugins/woo-dev-template
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer stan
      - run: composer test

  docker-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        wordpress: ['6.9.4', '7.0']
    env:
      PHP_VERSION: ${{ matrix.php }}
      WORDPRESS_VERSION: ${{ matrix.wordpress }}
      WOOCOMMERCE_VERSION: '10.7.0'
    steps:
      - uses: actions/checkout@v4
      - run: make env
      - run: make dev-up
      - run: make smoke
      - run: make dev-down
        if: always()
