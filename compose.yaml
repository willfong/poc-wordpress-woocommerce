services:
  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.8.6}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MARIADB_USER: ${MYSQL_USER:-wordpress}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wordpress-root}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
    volumes:
      - mariadb-data:/var/lib/mysql

  wordpress:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        WORDPRESS_VERSION: ${WORDPRESS_VERSION:-6.9.4}
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'WP_MEMORY_LIMIT', '256M' );
        define( 'WP_MAX_MEMORY_LIMIT', '512M' );
        define( 'DISALLOW_FILE_EDIT', true );
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    volumes:
      - wordpress-core:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins
      - ./uploads:/var/www/html/wp-content/uploads
      - ./config/php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro

  wp-cli:
    image: wordpress:cli-2.12.0-php8.3
    depends_on:
      mariadb:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_URL: ${WORDPRESS_URL:-http://localhost:8080}
      WORDPRESS_TITLE: ${WORDPRESS_TITLE:-WooCommerce Plugin Dev}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:-admin}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:-password}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:-admin@example.test}
      WORDPRESS_LOCALE: ${WORDPRESS_LOCALE:-en_US}
      WOOCOMMERCE_VERSION: ${WOOCOMMERCE_VERSION:-10.7.0}
      PLUGIN_SLUG: ${PLUGIN_SLUG:-woo-dev-template}
      FIXTURE_PROFILE: ${FIXTURE_PROFILE:-rich}
    volumes:
      - wordpress-core:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins
      - ./uploads:/var/www/html/wp-content/uploads
      - .:/workspace
    working_dir: /var/www/html

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  adminer:
    image: adminer:5
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8081}:8080"

volumes:
  mariadb-data:
  wordpress-core:
